
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSIA Airside SOC Console</title>
<link rel="stylesheet" href="style.css">
<script defer src="model.js"></script>
<script defer src="scenarios.js"></script>
<script defer src="data.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<aside class="sidebar">
  <header class="brand"><span class="mark" aria-hidden="true">✈</span><div>PSIA <small>Airside SOC</small></div></header>
  <nav aria-label="Console sections">
    <button data-page="overview" aria-current="page">Overview</button>
    <button data-page="console">SOC Console</button>
    <button data-page="dashboard">CISO Dashboard</button>
    <button data-page="registers">Registers</button>
    <button data-page="governance">AI Governance</button>
    <button data-page="evaluation">Evaluation</button>
  </nav>
  <span class="side-note"><span aria-hidden="true"></span> Academic simulation</span>
</aside>
<main>
<header class="top"><strong>Pakistan Smart International Airport</strong><span id="mode" class="tag">Offline ML</span></header>
<div id="status" role="status" aria-live="polite"></div>
<div id="benchmark-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<section id="view" aria-label="Console content"></section>
</main>
</body>
</html>
